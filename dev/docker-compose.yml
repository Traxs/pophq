# Local development stack for POP HQ. Start with `npm run dev:up`.
# Nothing here talks to AWS or Discord; no credentials are needed.
name: pophq-dev

services:
  dynamodb:
    # Official Amazon DynamoDB Local, with Streams support.
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  oidc:
    # Stands in for Cognito locally. No login form: the web app's dev sign-in picker chooses a persona
    # through the client id, and the issuer answers with that persona's subject and groups.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8081:8080"
    environment:
      JSON_CONFIG: >
        {"interactiveLogin": false, "httpServer": "NettyWrapper",
         "tokenCallbacks": [{"issuerId": "pophq", "tokenExpiry": 3600, "requestMappings": [
           {"requestParam": "client_id", "match": "pophq-dev-player", "claims": {"sub": "player", "groups": [], "aud": ["pophq-web"]}},
           {"requestParam": "client_id", "match": "pophq-dev-officer", "claims": {"sub": "officer", "groups": ["officer"], "aud": ["pophq-web"]}},
           {"requestParam": "client_id", "match": "pophq-dev-owner", "claims": {"sub": "owner", "groups": ["owner"], "aud": ["pophq-web"]}},
           {"requestParam": "client_id", "match": "*", "claims": {"sub": "newcomer", "groups": [], "aud": ["pophq-web"]}}
         ]}]}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/pophq/.well-known/openid-configuration || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  discord-sink:
    # Captures Discord webhook posts so messages can be inspected at http://localhost:8082/messages
    image: node:22-alpine
    command: ["node", "/app/discord-sink.mjs"]
    volumes:
      - ./discord-sink.mjs:/app/discord-sink.mjs:ro
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/messages || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

# Install with: npm run setup   (runs `pre-commit install` for commit and push hooks)
# Hooks are a convenience; CI runs the same checks as required status checks.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: npm-precommit
        name: lint, type-check and unit tests of changed packages
        entry: npm run --silent hook:pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: npm-prepush
        name: full unit test suite
        entry: npm run --silent hook:pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]
